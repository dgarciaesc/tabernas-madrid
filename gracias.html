<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Gracias · Tabernas con Historia</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
  <!-- Google Analytics 4 — medición de compras. Sustituye GA_ID por tu ID
       de medición (G-XXXXXXXXXX). Mientras siga como "G-XXXXXXXXXX" no se
       carga nada. Consent Mode: sin banner de cookies el consentimiento de
       analítica queda DENEGADO por defecto (no se guardan cookies; Google
       solo recibe pings anónimos). -->
  <script>
    window.GA_ID = "G-XXXXXXXXXX";
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    if (/^G-[A-Z0-9]{6,}$/.test(window.GA_ID) && window.GA_ID !== "G-XXXXXXXXXX") {
      gtag("consent", "default", { analytics_storage: "denied", ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied" });
      gtag("js", new Date());
      gtag("config", window.GA_ID, { linker: { domains: ["hiddenmadrid.com", "goldenage.hiddenmadrid.com", "tabernas.hiddenmadrid.com"] } });
      var gs = document.createElement("script");
      gs.async = true;
      gs.src = "https://www.googletagmanager.com/gtag/js?id=" + window.GA_ID;
      document.head.appendChild(gs);
    }
  </script>
</head>
<body>
  <div id="app">
    <main id="screen" style="padding: 20px 18px 32px">
      <div class="title-screen">
        <div class="title-emblem" id="emblem">⏳</div>
        <h1>Tabernas con Historia</h1>
        <div class="ornament">❦ ❦ ❦</div>
        <div class="card" id="resultCard">
          <div class="card-label">🔑 Vuestra licencia</div>
          <p id="msg">Confirmando el pago con Stripe…</p>
          <div id="codesArea"></div>
        </div>
        <p class="title-meta">
          Guardad el código (o los códigos): los pedirá cada app la primera
          vez que la abráis. Se activan en el primer móvil donde se
          introduzcan.
        </p>
      </div>
    </main>
  </div>

  <script src="js/license.js?v=3"></script>
  <script>
    (async () => {
      const $emblem = document.getElementById("emblem");
      const $msg = document.getElementById("msg");
      const $codesArea = document.getElementById("codesArea");

      const params = new URLSearchParams(location.search);
      const sessionId = params.get("session_id");
      const isBundle = params.get("bundle") === "1";
      if (!sessionId) {
        $emblem.textContent = "⚠";
        $msg.textContent = "Falta la referencia del pago. Si acabas de pagar, revisa el enlace que te llevó aquí.";
        return;
      }

      // el webhook de Stripe puede tardar unos segundos: reintentamos.
      // Si es el pack de las 2 aventuras, esperamos a que aparezcan
      // ambos códigos (uno por cada base de datos) antes de darnos
      // por satisfechos.
      async function poll(tries) {
        for (let i = 0; i < tries; i++) {
          try {
            const res = await fetch(
              `${License.WORKER_URL}/api/code-for-session?session_id=${encodeURIComponent(sessionId)}`
            );
            const data = await res.json();
            if (res.ok && Array.isArray(data.codes) && data.codes.length) {
              if (!isBundle || data.codes.length >= 2) return data.codes;
            }
          } catch (e) {}
          await new Promise((r) => setTimeout(r, 2000));
        }
        return null;
      }

      const codes = await poll(10);
      if (codes) {
        // evento de compra para GA4 (una vez por pago; transaction_id evita duplicados al recargar)
        try {
          const trackedKey = "ga_purchase_" + sessionId;
          if (typeof window.gtag === "function" && !localStorage.getItem(trackedKey)) {
            localStorage.setItem(trackedKey, "1");
            gtag("event", "purchase", {
              transaction_id: sessionId,
              value: isBundle ? 14.99 : 9.99,
              currency: "EUR",
              items: [{ item_id: isBundle ? "pack-2-aventuras" : "tabernas", item_name: isBundle ? "Pack 2 aventuras" : "Tabernas con Historia", price: isBundle ? 14.99 : 9.99, quantity: 1 }]
            });
          }
        } catch (e) {}
        $emblem.textContent = "⚜";
        $msg.textContent = codes.length > 1
          ? "¡Pago confirmado! Estos son vuestros códigos de licencia:"
          : "¡Pago confirmado! Este es vuestro código de licencia:";
        $codesArea.innerHTML = codes
          .map(
            (c) => `
              <div style="margin-top:14px">
                <p class="title-meta" style="margin-bottom:4px">${c.label}</p>
                <p class="big-score">${c.code}</p>
                <a class="btn-primary" href="${c.playUrl}" style="text-decoration:none; text-align:center; display:block">
                  Ir al juego
                </a>
              </div>`
          )
          .join("");
      } else {
        $emblem.textContent = "⏳";
        $msg.textContent =
          "El pago se ha confirmado pero el código tarda un poco más de lo normal. Recarga esta página en unos segundos.";
      }
    })();
  </script>
</body>
</html>
